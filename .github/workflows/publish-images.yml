name: 发布容器镜像

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      base_revision:
        required: false
        default: ""
        type: string
      ref_name:
        required: true
        type: string
      ref_type:
        required: false
        default: branch
        type: string
      push:
        # false：只做多架构构建校验，不登录 GHCR、不推送、不签发证明、不写回缓存（PR 上用）。
        required: false
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: publish-images-${{ inputs.push && 'push' || 'check' }}-${{ inputs.ref_name || github.ref_name }}
  cancel-in-progress: true

# 每个 service 在 AMD64 / ARM64 runner 原生构建，再按 digest 合并并证明最终 manifest。
# artifact 用 run_id + service + arch 隔离；覆盖同一槽位支持仅重跑失败 job。

jobs:
  scope:
    name: 发布范围
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      revision: ${{ steps.scope.outputs.revision }}
      ref_name: ${{ steps.scope.outputs.ref_name }}
      ref_type: ${{ steps.scope.outputs.ref_type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}

      - name: 跳过纯文档提交
        id: scope
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          BASE_REVISION: ${{ inputs.base_revision }}
          REF_NAME: ${{ inputs.ref_name || github.ref_name }}
          REF_TYPE: ${{ inputs.ref_type || github.ref_type }}
        run: |
          python scripts/ci_change_scope.py \
            --root . \
            --base "$BASE_REVISION" \
            --head "$REVISION" \
            --github-output "$GITHUB_OUTPUT"
          {
            printf 'revision=%s\n' "$REVISION"
            printf 'ref_name=%s\n' "$REF_NAME"
            printf 'ref_type=%s\n' "$REF_TYPE"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.service }} / ${{ matrix.arch }} 镜像
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, frontend, updater]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - service: web
            dockerfile: backend/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
          - service: updater
            dockerfile: deploy/updater/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scope.outputs.revision }}

      - name: 计算镜像名称与标签
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ needs.scope.outputs.ref_name }}
          REF_TYPE: ${{ needs.scope.outputs.ref_type }}
          REVISION: ${{ needs.scope.outputs.revision }}
          SERVICE: ${{ matrix.service }}
        run: bash scripts/ci-image-metadata.sh

      - name: 登录 GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 原生构建并按 digest 推送镜像
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          pull: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.scope.outputs.revision }}
          build-args: |
            BUILD_COMMIT=${{ needs.scope.outputs.revision }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
            type=gha,scope=${{ matrix.service }}
          # 构建校验（PR）只读缓存，不写回，避免 PR 分支的层挤掉 Beta 的缓存。
          cache-to: ${{ inputs.push && format('type=gha,mode=max,scope={0}-{1}', matrix.service, matrix.arch) || '' }}

      - name: 保存构建 digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::构建 digest 格式无效" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: 上传构建 digest
        if: inputs.push
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ github.run_id }}-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    name: ${{ matrix.service }} 多架构 manifest
    needs: [scope, publish]
    if: inputs.push && needs.scope.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, frontend, updater]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scope.outputs.revision }}

      - name: 计算镜像名称与标签
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ needs.scope.outputs.ref_name }}
          REF_TYPE: ${{ needs.scope.outputs.ref_type }}
          REVISION: ${{ needs.scope.outputs.revision }}
          SERVICE: ${{ matrix.service }}
        run: bash scripts/ci-image-metadata.sh

      - name: 登录 GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 下载两架构 digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-${{ github.run_id }}-${{ matrix.service }}-*
          path: ${{ runner.temp }}/digests

      - name: 合并 manifest 并核对架构
        id: merge
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ARTIFACT_PREFIX: digests-${{ github.run_id }}-${{ matrix.service }}
        run: bash scripts/ci-merge-image.sh

      - name: 签发并推送 SLSA 构建来源证明
        if: inputs.push
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
