name: CI

on:
  push:
    branches: [main, Beta]
    tags: ["v*"]
  # 第十一轮：PR → Beta 也跑完整门禁，回归在合并前拦下（此前只有 Beta push 才跑，红了再补）。
  pull_request:
    branches: [main, Beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: 变更范围
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      browser: ${{ steps.scope.outputs.browser }}
      plugin: ${{ steps.scope.outputs.plugin }}
      contract: ${{ steps.scope.outputs.contract }}
      version: ${{ steps.scope.outputs.version }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 计算需要运行的检查
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$BEFORE_SHA"; head="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # PR 仍跑完整门禁（--force-full）；文件清单只用于判定是否需要镜像构建校验。
            head="$PR_HEAD_SHA"
            base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" || echo "$PR_BASE_SHA")"
          fi
          args=(--root . --base "$base" --head "$head" --github-output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" == "pull_request" || "$REF_NAME" == "main" ]]; then
            args+=(--force-full)
          fi
          python scripts/ci_change_scope.py "${args[@]}"

  backend:
    name: 后端
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: telepilot-ci-test-password
          POSTGRES_DB: telepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telepilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-ci-jwt-secret-only-for-tests"
      PYTHONPATH: ".."
      TELEPILOT_TEST_REDIS_URL: "redis://localhost:6379/15"
      TELEPILOT_TEST_POSTGRES_URL: "postgresql+asyncpg://postgres:telepilot-ci-test-password@localhost:5432/telepilot_test"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        working-directory: backend
        run: ruff check app

      - name: Test backend
        working-directory: backend
        run: pytest

      - name: Reject stale OpenAPI snapshot from any backend model change
        run: |
          python scripts/export-openapi.py
          git diff --exit-code -- openapi/telepilot.openapi.json

      - name: Validate plugin examples
        if: needs.change-scope.outputs.plugin == 'true' || needs.change-scope.outputs.full == 'true'
        run: PYTHONPATH=backend:. python scripts/validate-plugin-examples.py

  frontend:
    name: 前端
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend regression tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  frontend-browser:
    name: 浏览器
    needs: change-scope
    if: needs.change-scope.outputs.browser == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Run accessibility tests
        working-directory: frontend
        run: pnpm test:a11y

      - name: Run visual regression tests
        working-directory: frontend
        run: pnpm test:visual

  api-contract:
    name: API 契约
    needs: change-scope
    if: needs.change-scope.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-ci-jwt-secret-only-for-tests"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install contract dependencies
        run: |
          python -m pip install -e "./backend[dev]"
          pnpm --dir frontend install --frozen-lockfile

      - name: Regenerate OpenAPI, TypeScript and plugin contracts
        run: make codegen

      - name: Reject stale generated contract
        run: git diff --exit-code -- openapi/telepilot.openapi.json frontend/src/api/schema.ts schemas/plugin.schema.json

      - name: Test API contract invariants
        working-directory: backend
        run: pytest -q app/tests/test_openapi_contract.py

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.23"
          cache-dependency-path: gateway/go.sum

      # 镜像构建不再跑 go test / go vet（多架构 QEMU 下 arm64 曾耗时 9 分钟），这里是唯一的 Gateway 测试门禁。
      - name: Test Gateway
        working-directory: gateway
        run: go test ./...

      - name: Vet Gateway
        working-directory: gateway
        run: go vet ./...

  db-migrations:
    name: 数据库迁移门禁
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telebot
          POSTGRES_PASSWORD: telebot
          POSTGRES_DB: telebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+asyncpg://telebot:telebot@localhost:5432/telebot"
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-ci-jwt-secret-only-for-tests"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: 迁移链可在真实 PG 上升级到 head
        working-directory: backend
        run: alembic upgrade head

      - name: 模型与迁移无漂移（alembic check）
        working-directory: backend
        run: alembic check

  version-sync:
    name: 版本同步
    needs: change-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check release version sync
        # 版本源：backend/app/__init__.py、frontend/package.json、openapi info.version 三处字面量一致；
        # pyproject.toml（dynamic）与 frontend/src/lib/version.ts（导入 package.json）只校验结构；
        # CHANGELOG 有当前版本段；iOS OpenAPI 子集不带服务器版本。与 scripts/bump-version.py 自检同一脚本。
        run: python scripts/check-version-sync.py

      - name: Check branch release channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          current_text = Path("backend/app/__init__.py").read_text()
          current = re.search(r'__version__ = "([^"]+)"', current_text).group(1)
          stable = re.fullmatch(r"\d+\.\d+\.\d+", current)
          prerelease = re.fullmatch(r"\d+\.\d+\.\d+-(?:alpha|beta|rc)\.\d+", current)
          if not stable and not prerelease:
              raise SystemExit(f"版本格式不符合发布约定：{current}")

          event = os.environ["EVENT_NAME"]
          ref_name = os.environ["REF_NAME"]
          base_ref = os.environ.get("BASE_REF", "")
          targets_main = (event == "pull_request" and base_ref == "main") or (
              event == "push" and ref_name == "main"
          )
          if targets_main and prerelease:
              raise SystemExit(
                  f"main 发布线只允许稳定版本，当前为 {current}。"
                  "请在发布准备分支去掉 prerelease 后缀后再创建或更新 PR。"
              )
          if event == "push" and ref_name == "Beta" and not prerelease:
              current_sha = os.environ["CURRENT_SHA"]
              main_sha = subprocess.check_output(
                  ["git", "rev-parse", "origin/main"],
                  text=True,
              ).strip()
              if current_sha != main_sha:
                  raise SystemExit(
                      f"Beta 只允许预发布版本；稳定版本 {current} 仅可作为发布检查点"
                      f"与 main 完全同步，当前 Beta={current_sha}，main={main_sha}。"
                  )
          channel = "预发布" if prerelease else "稳定版"
          print(f"release channel guard ok: {current} ({channel})")
          PY

  image-check:
    name: 镜像构建校验
    needs: change-scope
    # 只在 PR 上、且 Dockerfile / 依赖清单 / 发布工作流变化时做一次不推送的多架构构建，
    # 让镜像构建问题在合并前暴露（push 时由「发布预构建镜像」真正构建并推送）。
    if: github.event_name == 'pull_request' && needs.change-scope.outputs.images == 'true'
    uses: ./.github/workflows/publish-images.yml
    with:
      revision: ${{ github.sha }}
      base_revision: ${{ github.event.pull_request.base.sha }}
      ref_name: pr-${{ github.event.pull_request.number }}
      push: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  ci-gate:
    name: CI Gate
    if: always()
    needs: [change-scope, backend, frontend, frontend-browser, api-contract, gateway, db-migrations, version-sync, image-check]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总条件任务结果
        env:
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.frontend-browser.result }}
          API_CONTRACT: ${{ needs.api-contract.result }}
          GATEWAY: ${{ needs.gateway.result }}
          DB_MIGRATIONS: ${{ needs.db-migrations.result }}
          VERSION_SYNC: ${{ needs.version-sync.result }}
          IMAGE_CHECK: ${{ needs.image-check.result }}
        run: |
          for result in "$CHANGE_SCOPE" "$BACKEND" "$FRONTEND" "$BROWSER" "$API_CONTRACT" "$GATEWAY" "$DB_MIGRATIONS" "$VERSION_SYNC" "$IMAGE_CHECK"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "CI 子任务失败或取消：$result" >&2
              exit 1
            fi
          done
          echo "所有必需检查已通过"

  publish-images:
    name: 发布预构建镜像
    needs: ci-gate
    if: always() && github.event_name == 'push' && needs.ci-gate.result == 'success'
    uses: ./.github/workflows/publish-images.yml
    with:
      revision: ${{ github.sha }}
      base_revision: ${{ github.event.before }}
      ref_name: ${{ github.ref_name }}
      ref_type: ${{ github.ref_type }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
