name: 插件库兼容

# 用本次提交的宿主代码检查官方插件库（Anoyou/telebot-plugins main）是否仍能安装、加载和通过测试，
# 把“宿主改动弄坏已发布插件”的发现时间从插件库 CI 提前到主仓库 PR。
# - check_host_compat.py：plugin.json 校验、真实 loader 加载、Host API 签名、权限、最低版本推断、on_startup；
# - 插件库 pytest 全量（含 interaction-ai-chat 等插件的行为测试与宿主兼容用例）。
# 有失败时 scripts/plugin-compat-check.py 会用基线宿主重跑，只有“基线通过、本次失败”才判失败；
# 插件库自身已有的失败只给警告，不阻塞主仓库 PR。
# 单独成文件，不影响 CI 工作流的变更范围判定；PR 指向 Beta / main 时运行。
on:
  pull_request:
    branches: [Beta, main]
    paths:
      - "backend/**"
      - "schemas/plugin.schema.json"
      - ".github/workflows/plugin-compat.yml"
  push:
    branches: [Beta, main]
    paths:
      - "backend/**"
      - "schemas/plugin.schema.json"
      - ".github/workflows/plugin-compat.yml"
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: "telebot-plugins 的分支 / 标签 / 提交"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: plugin-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-compat:
    name: 插件库兼容检查（telebot-plugins ${{ github.event.inputs.plugins_ref || 'main' }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 仅供测试进程实例化配置模型，不连接任何服务、不是真实密钥
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-plugin-compat-ci-only"
      TELEPILOT_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 检出官方插件库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Anoyou/telebot-plugins
          ref: ${{ github.event.inputs.plugins_ref || 'main' }}
          path: .plugin-compat/telebot-plugins
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装宿主后端依赖
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: 检出基线宿主（PR 目标分支 / 推送前的提交）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'Beta' }}
          path: .plugin-compat/base-host
          fetch-depth: 1

      - name: 宿主兼容性检查 + 插件库测试
        run: |
          echo "插件库提交：$(git -C .plugin-compat/telebot-plugins rev-parse --short HEAD)"
          python scripts/plugin-compat-check.py \
            --plugins .plugin-compat/telebot-plugins \
            --host-repo "$GITHUB_WORKSPACE" \
            --base-repo .plugin-compat/base-host \
            --report "$GITHUB_WORKSPACE/plugin-compat-report.json"

      - name: 上传兼容性报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-compat-report
          path: plugin-compat-report.json
          if-no-files-found: ignore
          retention-days: 14
